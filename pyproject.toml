    "tensorflow>=2.22.0rc0",
]

[project.scripts]
diagnostic-des-tumeurs = "diagnostic_des_tumeurs:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
