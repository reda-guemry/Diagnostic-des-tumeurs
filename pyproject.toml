[project]
name = "diagnostic-des-tumeurs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reda-guemry", email = "guemryreda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.153.0",
    "ipykernel>=7.4.0",
    "keras>=3.15.1,<3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    # tensorflow-hub 0.16.1 still imports pkg_resources, removed in setuptools 82+.
    "setuptools<82",
    # Latest stable TensorFlow stack: TF 2.21, Keras 3.15, tf-keras 2.21 (TF-Hub requirement).
    "tensorflow>=2.21.0,<2.22.0",
    "tensorflow-hub>=0.16.1,<0.17.0",
    "tf-keras>=2.21.0,<2.22.0",
    "ultralytics>=8.4.188",
]

[project.scripts]
diagnostic-des-tumeurs = "diagnostic_des_tumeurs:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
